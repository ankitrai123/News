<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}IntelPod{% endblock %}</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e3e0;--accent:#2b5fd9;--good:#1f8a4c;--warn:#b26b00;--bad:#c0392b;--bar:#dde6fb}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--ink:#ececee;--muted:#9a9aa2;--line:#2e2e33;--accent:#7aa2ff;--good:#4cc985;--warn:#f0a940;--bad:#ff6b5b;--bar:#2a3550}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font-size:17px}header a{color:var(--muted);text-decoration:none}header a:hover{color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:14px 0 6px}
a{color:var(--accent)}.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted);margin-right:4px}
.score{font-weight:700;font-size:20px;min-width:56px;text-align:right}
.row{display:flex;gap:14px;align-items:flex-start}.grow{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.bar{background:var(--bar);height:8px;border-radius:4px;overflow:hidden;width:120px}.bar>i{display:block;height:100%;background:var(--accent)}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);padding:10px;border-radius:8px}
@media (max-width:640px){.row{flex-direction:column;gap:4px}.score{text-align:left}
 table.comp td{display:block;width:auto!important;border:0;padding:2px 0}table.comp tr{display:block;border-bottom:1px solid var(--line);padding:4px 0}
 header{gap:10px;padding:10px 16px}}
table{display:table}.scroll{overflow-x:auto}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;border:1px solid var(--warn);color:var(--warn)}
</style>
</head>
<body>
<header><b>IntelPod</b>
<a href="/">Briefing</a><a href="/runs">Runs &amp; status</a><a href="/feeds">Sources</a><a href="/settings">Settings</a>
<span class="muted small" style="margin-left:auto">v{{ version }} · Phase 1{% if running %} · <span class="warn">run in progress…</span>{% endif %}</span></header>
<main>
{% if last_error %}<div class="banner">Last run failed: {{ last_error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
