# Public RSS/Atom feed registry.
#
# IMPORTANT: these URLs come from publishers' publicly listed feeds as known at
# development time. They could NOT be fetched from the build sandbox (its network
# policy blocks news hosts), so every entry starts as `verified: false`.
# Run `intelpod feeds check` on your machine: it fetches each feed, reports
# status / item count / newest date, and records the result in the database.
# Disable or fix any feed that fails. Feeds are free to read but remain subject to
# each publisher's terms; IntelPod stores only titles, links, dates and short
# descriptions, never full articles.
#
# source_type: news | official | international_org | think_tank
# Editorial-orientation metadata belongs to the Phase 3 source registry, not here.

feeds:
